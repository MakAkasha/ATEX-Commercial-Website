name: CI

on:
  push:
  pull_request:

# Read-only token: nothing in this workflow writes to the repo.
permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor: `node --test` only accepts glob patterns from v22.0.0,
        # and the test script relies on one. 24 is what the project runs locally.
        node-version: ["22.x", "24.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cheap, targeted guard: the catalog seed manifest is parsed with a bare
      # try/catch in server/db.js, so invalid JSON there fails silently at runtime.
      - name: Verify catalog seed manifest parses
        run: node -e "JSON.parse(require('fs').readFileSync('server/data/catalog-products.json','utf8'))"

      - name: Lint
        run: npm run lint

      # Includes test/blog.content.rules.test.js: broken blog links, placeholders,
      # missing alt text, tables that do not collapse to cards on phones.
      - name: Test
        run: npm test

      # A broken `vite build` is a broken deploy. Same step the local push gate runs.
      - name: Build
        run: npm run build

  # Report only. The tree has known advisories today (see the job log), so making
  # this blocking would fail every unrelated PR. Flip continue-on-error to false
  # once `npm audit` is clean.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
